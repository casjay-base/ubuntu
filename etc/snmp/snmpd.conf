# snmpd.conf

master agentx

proc  snmpd httpd nginx postfix
disk  / 0
load  10 5 5

###########################################################################
# Only listen on loopback - munin and the local checks are the only consumers
# and no read-write access is configured at all (no rwuser/rwcommunity)
agentAddress udp:127.0.0.1:161,udp6:[::1]:161

###########################################################################
# SNMPv3 read-only user - the account itself is created at bootstrap, never
# committed. With snmpd stopped, run as root:
#   net-snmp-create-v3-user -ro -A "$(openssl rand -base64 24)" -a SHA-512 \
#     -X "$(openssl rand -base64 24)" -x AES publicv3ro
# That appends the createUser line to /var/lib/net-snmp/snmpd.conf (0600).
# Until it is run, only the loopback v2c community below works.
rouser       publicv3ro  authPriv
rocommunity  public  127.0.0.1

view all     included  .1                               80

###########################################################################
syslocation  "Amsterdam, NY"
syscontact  "System Administrator"
sysservices 79

###########################################################################
trapsink  127.0.0.1 public
trap2sink  127.0.0.1 public
informsink  127.0.0.1
trapcommunity  public
authtrapenable  1
