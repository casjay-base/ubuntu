# rsync server
motd file = /etc/casjaysdev/banners/rsync.txt
log file = /var/log/rsyncd.log
pid file = /var/run/rsyncd.pid
lock file = /var/run/rsyncd.lock

# Safe defaults so any module added without its own settings inherits an
# unprivileged, read-only, chrooted export instead of a root-owned writable one
uid = nobody
gid = nobody
use chroot = yes
read only = yes
max connections = 10

&include /etc/rsync.d
