# Fail2Ban filter for Microsoft SQL Server (mssql-server) login failures.
# Disabled by default in jail.local; enabled at deploy time by min.sh
# only when mssql-server is actually detected on the host.
[Definition]
failregex = ^.*Login failed for user '.*'\.\s*Reason:.*\[CLIENT:\s*<HOST>\]\s*$
ignoreregex =
