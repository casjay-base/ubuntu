# Fail2Ban filter for Microsoft SQL Server (mssql-server) login failures.
# The mssql-auth jail is always enabled in jail.local; min.sh only
# ensures its logpath exists so the jail self-heals once mssql-server
# is installed and starts writing to it.
[Definition]
failregex = ^.*Login failed for user '.*'\.\s*Reason:.*\[CLIENT:\s*<HOST>\]\s*$
ignoreregex =
