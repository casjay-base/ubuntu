# see "man logrotate" for details
# Policy for this tree: rotate monthly OR at a size cap, whichever comes first,
# with no retained backups (rotate 0) and no compression. Security-relevant
# logs are the exception - they keep copies up to maxage 180 instead of being
# discarded on rotation, so there is still a forensic window after an incident.
monthly
rotate 0
create
nodateext
nocompress
# Backstop size cap so a log that goes loud mid-month cannot fill the disk
# waiting for the monthly run; per-file stanzas below tighten or relax it
maxsize 100M

# no packages own wtmp and btmp -- we will rotate them here
/var/log/wtmp {
    monthly
    create 0664 root utmp
    maxsize 100M
    maxage 180
    rotate 12
}

# btmp records failed logins, so it fills fastest under brute force - it needs
# the size cap more than any other file here
/var/log/btmp {
    missingok
    monthly
    create 0600 root utmp
    maxsize 100M
    maxage 180
    rotate 12
}

# security and mail logs -- rotate at 100M or monthly, whichever comes first,
# and keep the rotated copies for 180 days rather than discarding them.
# Grouped into one stanza so rsyslog is HUPed once: without that postrotate it
# keeps writing to the unlinked inode and the new file stays empty forever.
# These four are deliberately NOT listed in logrotate.d/rsyslog - logrotate
# treats a path defined twice as a fatal error and skips the whole second file.
/var/log/auth.log
/var/log/mail.log
/var/log/auth.log
/var/log/mail.log
{
    missingok
    monthly
    maxsize 100M
    maxage 180
    rotate 12
    sharedscripts
    postrotate
        /usr/bin/systemctl -s HUP kill rsyslog.service >/dev/null 2>&1 || true
    endscript
}

include /etc/logrotate.d
