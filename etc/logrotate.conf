# see "man logrotate" for details
# rotate log files weekly
monthly
rotate 0
create
nodateext
nocompress

# no packages own wtmp and btmp -- we will rotate them here
/var/log/wtmp {
    monthly
    create 0664 root utmp
    maxsize 100M
    rotate 0
}

/var/log/btmp {
    missingok
    monthly
    create 0600 root utmp
    rotate 0
}

# security and mail logs -- rotate at 100M or monthly, whichever comes first
/var/log/auth.log {
    missingok
    monthly
    maxsize 100M
    rotate 0
}

/var/log/mail.log {
    missingok
    monthly
    maxsize 100M
    rotate 0
}

/var/log/auth.log {
    missingok
    monthly
    maxsize 100M
    rotate 0
}

/var/log/mail.log {
    missingok
    monthly
    maxsize 100M
    rotate 0
}

include /etc/logrotate.d
