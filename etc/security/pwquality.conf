# Password quality floor for passwd/chpasswd/useradd via pam_pwquality.

# Minimum length, after the per-class credit below is applied
minlen = 12

# Require at least one of each class instead of trading length for variety
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1

# At least 4 character classes must be present
minclass = 4

# Reject runs of repeated or sequential characters
# Reject runs of the same character (aaaa) and obvious sequences (abcd, 1234)
maxrepeat = 3
maxsequence = 4

# Don't limit runs of the same character class - random and passphrase-style
# passwords trip this constantly without being weaker
maxclassrepeat = 0

# Reject passwords containing the username or GECOS words
usercheck = 1
gecoscheck = 1

# Reject anything found in the cracklib dictionary
dictcheck = 1

# Number of characters that must differ from the old password
difok = 5

# Apply all of the above when root sets a password, not just unprivileged users
#enforce_for_root
