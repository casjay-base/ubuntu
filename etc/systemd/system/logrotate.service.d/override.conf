# =========================================================
#  🛡️ logrotate.service — mount-namespace fix
# =========================================================
# PrivateDevices=true (stock unit hardening) makes systemd bind-mount a
# private /dev for this service, which fails on this host with
# "Failed to set up mount namespacing: /run/systemd/unit-root/dev:
# Invalid argument" and takes down log rotation entirely (exit 226).
# logrotate never touches device nodes, so disabling this one directive
# restores function without loosening anything else the stock unit sets
# (ProtectSystem, ProtectKernel*, RestrictNamespaces, etc. all stay on).

[Service]
PrivateDevices=false
