kernel.domainname=
kernel.printk = 3 4 1 3
kernel.shmmax=17179869184
kernel.shmall=4194304

fs.file-max = 2097152

vm.overcommit_memory = 1
vm.max_map_count=262144

net.core.somaxconn = 65535
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60

# Forwarding stays on - Docker requires it for container networking
net.ipv4.ip_forward = 1
net.ipv4.conf.default.forwarding = 1
net.ipv4.tcp_syncookies = 1

# Log packets with impossible source addresses instead of dropping them silently
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# This is not a router - answering ARP for addresses it does not own lets an
# attacker on the same segment redirect traffic through this host
net.ipv4.conf.all.proxy_arp = 0
net.ipv4.conf.default.proxy_arp = 0

# Do not emit ICMP redirects (host, not a router) and never act on received ones
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Source routing lets the sender pick the return path - never legitimate here
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Reverse path filtering in loose mode (2), not strict (1) - strict breaks
# asymmetric routing on multi-homed and Docker-bridged hosts
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# A server addresses itself statically - do not let a rogue RA on the segment
# install a default route or prefix
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Hide kernel pointers from /proc and restrict dmesg to root, so a local
# unprivileged process cannot harvest KASLR offsets or boot-time secrets
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

